name: My First Workflow

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello, CI/CD!"

      - name: Check environment
        run: |
          pwd
          ls -la
          go version # Проверим, что Go уже предустановлен на раннере