name: Pull request CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Build and test Go packages
        working-directory: app
        run: |
          go build ./...
          go test ./...

      - name: Start the booking service
        run: docker compose -f deploy/compose.yaml up -d --build --wait frontend

      - name: Check booking through Nginx
        run: bash deploy/smoke.sh

      - name: Check upgrade from migration 001
        env:
          COMPOSE_PROJECT_NAME: tickets-upgrade
          COMPOSE_FILE: deploy/compose.yaml
        run: |
          docker compose up -d --wait postgres
          db() { docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U tickets -d tickets "$@"; }
          db < app/internal/booking/migrations/001_init.sql
          db <<'SQL'
          CREATE TABLE schema_migrations (name text PRIMARY KEY);
          INSERT INTO schema_migrations VALUES ('001_init.sql');
          INSERT INTO events (id, title, category, venue, description, starts_at, capacity, remaining)
          VALUES ('upgrade-check', 'Before upgrade', 'test', 'test', '', now(), 10, 7);
          SQL
          docker compose up -d --build --wait api
          test "$(db -Atc "SELECT count(*) FROM schema_migrations WHERE name = '002_add_event_organizer.sql'")" = 1
          test "$(db -Atc "SELECT remaining FROM events WHERE id = 'upgrade-check' AND organizer_name IS NULL")" = 7

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color
          docker compose -p tickets-upgrade -f deploy/compose.yaml logs --no-color

      - name: Save tested API image
        if: github.event_name == 'push'
        run: |
          container=$(docker compose -f deploy/compose.yaml ps -q api)
          docker tag "$(docker inspect --format '{{.Image}}' "$container")" "tickets-api:$GITHUB_SHA"
          docker save "tickets-api:$GITHUB_SHA" -o "$RUNNER_TEMP/api.tar"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-api
          path: ${{ runner.temp }}/api.tar
          retention-days: 1

      - name: Save tested frontend image
        if: github.event_name == 'push'
        run: |
          container=$(docker compose -f deploy/compose.yaml ps -q frontend)
          docker tag "$(docker inspect --format '{{.Image}}' "$container")" "tickets-frontend:$GITHUB_SHA"
          docker save "tickets-frontend:$GITHUB_SHA" -o "$RUNNER_TEMP/frontend.tar"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-frontend
          path: ${{ runner.temp }}/frontend.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_URI: cr.selcloud.ru/${{ vars.SELECTEL_REGISTRY }}/tickets-api
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-api
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: tested-frontend
          path: ${{ runner.temp }}

      - name: Log in to Selectel Container Registry
        env:
          REGISTRY_USERNAME: ${{ secrets.SELECTEL_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SELECTEL_REGISTRY_PASSWORD }}
          REGISTRY_NAME: ${{ vars.SELECTEL_REGISTRY }}
        run: |
          : "${REGISTRY_NAME:?Set SELECTEL_REGISTRY in staging environment variables}"
          : "${REGISTRY_USERNAME:?Set SELECTEL_REGISTRY_USERNAME in staging environment secrets}"
          : "${REGISTRY_PASSWORD:?Set SELECTEL_REGISTRY_PASSWORD in staging environment secrets}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login cr.selcloud.ru --username "$REGISTRY_USERNAME" --password-stdin

      - name: Publish API and record digest
        shell: bash
        run: |
          image="$IMAGE_URI:$GITHUB_SHA"
          manifest_digest() {
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          if ! digest=$(manifest_digest 2>"$RUNNER_TEMP/inspect-error"); then
            if ! grep -Eiq 'manifest unknown|not found|name unknown' "$RUNNER_TEMP/inspect-error"; then
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
            docker load -i "$RUNNER_TEMP/api.tar"
            docker tag "tickets-api:$GITHUB_SHA" "$image"
            docker push "$image"
            digest=$(manifest_digest)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Commit `%s` → `%s@%s`\n' "$GITHUB_SHA" "$IMAGE_URI" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish frontend and record digest
        env:
          IMAGE_URI: cr.selcloud.ru/${{ vars.SELECTEL_REGISTRY }}/tickets-frontend
        shell: bash
        run: |
          image="$IMAGE_URI:$GITHUB_SHA"
          manifest_digest() {
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          if ! digest=$(manifest_digest 2>"$RUNNER_TEMP/inspect-error"); then
            if ! grep -Eiq 'manifest unknown|not found|name unknown' "$RUNNER_TEMP/inspect-error"; then
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
            docker load -i "$RUNNER_TEMP/frontend.tar"
            docker tag "tickets-frontend:$GITHUB_SHA" "$image"
            docker push "$image"
            digest=$(manifest_digest)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Commit `%s` → `%s@%s`\n' "$GITHUB_SHA" "$IMAGE_URI" "$digest" >> "$GITHUB_STEP_SUMMARY"