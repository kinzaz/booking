# $schema: https://json.schemastore.org/github-workflow.json
name: Staging Ansible ping

on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        required: true
      api_image:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      apply:
        description: "Применить плейбук на staging"
        type: boolean
        default: false
      api_image:
        description: "Полный адрес образа API с @sha256 для этого запуска"
        type: string
        required: false
  push:
    branches: [codex/selectel-ansible-ping]

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install ansible-core
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r infra/ansible/requirements.yml

      - name: Подготовить пароль Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          : "${VAULT_PASSWORD:?Не задан секрет ANSIBLE_VAULT_PASSWORD}"
          printf '%s\n' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault-pass" >> "$GITHUB_ENV"

      - name: Проверить синтаксис staging-плейбука
        run: |
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" \
            -i infra/ansible/inventory.ini infra/ansible/site.yml --syntax-check

      - name: Record runner and staging addresses
        continue-on-error: true
        run: |
          target=$("$RUNNER_TEMP/ansible/bin/ansible-inventory" -i infra/ansible/inventory.ini --host tickets-staging | jq -er '.ansible_host')
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo "Target: $target:22"
          printf 'Runner public IPv4: '
          curl -4fsS --max-time 5 https://checkip.amazonaws.com || echo 'lookup unavailable'

      - name: Check staging SSH access
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
          APPLY: ${{ inputs.apply || false }}
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          umask 077
          key="$RUNNER_TEMP/staging_key"
          trap 'rm -f "$key"' EXIT
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat infra/ansible/selectel_known_hosts >> ~/.ssh/known_hosts
          "$RUNNER_TEMP/ansible/bin/ansible" staging -i infra/ansible/inventory.ini \
            --private-key "$key" --ssh-common-args='-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes' \
            -vvvv -m ansible.builtin.ping
          mode=(--check)
          if [[ "$APPLY" == "true" ]]; then
            mode=()
          fi
          image_args=()
          if [[ -n "$API_IMAGE" ]]; then
            if [[ ! "$API_IMAGE" =~ ^cr\.selcloud\.ru/tickets-lab/tickets-api@sha256:[0-9a-f]{64}$ ]]; then
              echo "Ожидается образ tickets-api из tickets-lab с полным digest sha256" >&2
              exit 1
            fi
            image_args=(-e "api_image=$API_IMAGE")
          fi
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" \
            -i infra/ansible/inventory.ini infra/ansible/site.yml \
            --private-key "$key" \
            --ssh-common-args='-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes' \
            "${mode[@]}" "${image_args[@]}"
          if [[ "$APPLY" == "true" ]]; then
            host_vars=$("$RUNNER_TEMP/ansible/bin/ansible-inventory" \
              -i infra/ansible/inventory.ini --host tickets-staging |
              jq -er '.ansible_user + "@" + .ansible_host')
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -i "$key" "$host_vars" \
              'BASE_URL=http://127.0.0.1:8080 bash -s' < deploy/smoke.sh
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -i "$key" "$host_vars" 'cd /opt/tickets-staging && bash -se' <<'REMOTE'
          tmp=$(mktemp .last-good-release.XXXXXX)
          trap 'rm -f "$tmp"' EXIT
          for service in api frontend; do
            container=$(docker compose ps -q "$service")
            image=$(docker inspect --format '{{.Config.Image}}' "$container")
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            printf '%s_IMAGE=%s\n' "${service^^}" "$image" >> "$tmp"
          done
          mv -f "$tmp" last-good-release.env
          REMOTE
          fi
