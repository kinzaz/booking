name: tickets-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD}"
    volumes:
      - tickets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    image: "${API_IMAGE:-cr.selcloud.ru/tickets-lab/tickets-api@sha256:05093681f16585bc3a952881633096a3197b551f266e5d6c784a3b1e729ceb1f}"
    environment:
      DATABASE_URL: "postgres://tickets:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD}@postgres:5432/tickets?sslmode=disable"
      BOOKING_TTL: ${BOOKING_TTL:-15m}
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: ../app
      target: worker
    environment:
      DATABASE_URL: "postgres://tickets:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD}@postgres:5432/tickets?sslmode=disable"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: "${FRONTEND_IMAGE:-cr.selcloud.ru/tickets-lab/tickets-frontend@sha256:e94f6614e3b063a16ca7606c68af016a755e0fb962c8b75dee42e582002d1bda}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  tickets-data:
