name: tickets-roadmap

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    volumes:
      - tickets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../app
      target: api
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      BOOKING_TTL: ${BOOKING_TTL:-15m}
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: ../app
      target: worker
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ../app/frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  tickets-data:
