server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^(/api/|/health$|/ready$) {
        proxy_pass http://api:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }
}
