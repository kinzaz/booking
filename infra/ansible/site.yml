- name: Подготовить staging в Selectel
  hosts: staging
  become: true
  gather_facts: false

  tasks:
    - name: Разрешить вход на staging по ключу GitHub Actions
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/tickets-staging-ci.pub') }}"
        state: present

    - name: Установить Docker Engine и плагин Compose из репозитория Ubuntu
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Запустить Docker и включить автозапуск
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Войти в Selectel Container Registry для скачивания образов
      community.docker.docker_login:
        registry_url: cr.selcloud.ru
        username: "{{ vault_selectel_registry_username }}"
        password: "{{ vault_selectel_registry_password }}"
        state: present
      no_log: true

    - name: Создать каталог приложения на staging
      ansible.builtin.file:
        path: /opt/tickets-staging
        state: directory
        mode: '0750'

    - name: Скопировать конфигурацию Compose на staging
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/compose.staging.yaml"
        dest: /opt/tickets-staging/compose.yaml
        mode: '0644'

    - name: Скопировать конфигурацию Nginx на staging
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/nginx.conf"
        dest: /opt/tickets-staging/nginx.conf
        mode: '0644'

    - name: Записать пароль PostgreSQL в файл окружения Compose
      ansible.builtin.copy:
        dest: /opt/tickets-staging/.env
        content: |
          POSTGRES_PASSWORD={{ vault_postgres_password }}
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Запустить frontend и его зависимости на staging
      community.docker.docker_compose_v2:
        project_src: /opt/tickets-staging
        services:
          - frontend
        state: present
        wait: true